[mypy]
python_version = 3.12
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
disallow_untyped_defs = False
check_untyped_defs = True
no_implicit_optional = True
exclude = (?x)(
    ^venv/
    | ^data/raw/
    | ^data/processed/
    | ^tests/
  )

# pandas/numpy/yfinance stubs are incomplete/absent; don't fail the build on that
[mypy-yfinance.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

# matplotlib's stubs are frequently out of step with pandas Series/.values
# typing (ExtensionArray unions) — these are stub-friction false positives,
# not real bugs; the plotting code is covered by end-to-end smoke tests
# instead of static typing.
[mypy-visualization.charts]
ignore_errors = True

[mypy-visualization.dashboard]
ignore_errors = True
