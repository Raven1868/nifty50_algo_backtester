name: CI

# Runs on every push and pull request so a broken change is caught before
# it reaches main, rather than discovered the next time someone runs the
# backtester (e.g. the yfinance MultiIndex-columns bug — this pipeline
# would have caught it at merge time via test_data_cleaning.py).
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest mypy pandas-stubs

      - name: Run unit + regression tests
        run: python -m pytest tests/ -v

      - name: Type check (mypy)
        run: python -m mypy . --config-file mypy.ini

  config-validate:
    name: Validate config.yaml schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pyyaml pandas
      - name: Validate the shipped config.yaml against the schema
        run: python -c "from config_schema import load_and_validate_config; load_and_validate_config('config.yaml'); print('config.yaml is valid')"
